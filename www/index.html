  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { 
      --blood: #cc0000; 
      --dark-blood: #660000;
      --metal: #1a1a1a; 
      --steel: #4a4a4a;
      --neon-red: #ff1a1a;
    }

    body {
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background-color: #030303;
      font-family: 'Anton','Impact',sans-serif;
      color: #fff; overflow-x: hidden; position: relative;
    }

    /* GRUNGE / NOISE OVERLAY */
    body::after {
      content: "";
      position: fixed; inset: 0;
      background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="noiseFilter"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noiseFilter)"/></svg>');
      opacity: 0.08;
      pointer-events: none; z-index: 999;
    }

    /* SCANLINES */
    body::before {
      content: ""; position: fixed; inset: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      background-size: 100% 4px, 3px 100%;
      pointer-events: none; z-index: 998;
    }

    .page {
      position: relative; z-index: 1;
      display: flex; flex-direction: column;
      align-items: center; gap: 40px;
      padding: 50px 16px; width: 100%;
    }

    /* TITLE GLITCH EFFECT */
    .title-wrap { text-align: center; line-height: 1; text-transform: uppercase; position: relative; }
    .title-main {
      font-family: 'Bebas Neue','Anton',sans-serif;
      font-size: clamp(60px, 10vw, 120px); letter-spacing: 2px;
      color: #fff;
      position: relative;
      text-shadow: 4px 4px 0px var(--dark-blood);
    }
    .title-main::before, .title-main::after {
      content: 'NU METAL ROLETA';
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: #030303;
    }
    .title-main::before {
      left: 2px; text-shadow: -2px 0 var(--neon-red);
      clip-path: polygon(0 20%, 100% 20%, 100% 25%, 0 25%);
      animation: glitch-anim 2.5s infinite linear alternate-reverse;
    }
    .title-main::after {
      left: -2px; text-shadow: -2px 0 #fff;
      clip-path: polygon(0 60%, 100% 60%, 100% 65%, 0 65%);
      animation: glitch-anim 3s infinite linear alternate-reverse;
    }

    @keyframes glitch-anim {
      0% { clip-path: polygon(0 20%, 100% 20%, 100% 25%, 0 25%); transform: translate(0); }
      10% { clip-path: polygon(0 60%, 100% 60%, 100% 65%, 0 65%); transform: translate(-2px, 2px); }
      20% { clip-path: polygon(0 10%, 100% 10%, 100% 20%, 0 20%); transform: translate(2px, -2px); }
      30% { clip-path: polygon(0 80%, 100% 80%, 100% 85%, 0 85%); transform: translate(0); }
      100% { clip-path: polygon(0 30%, 100% 30%, 100% 35%, 0 35%); }
    }

    .title-sub {
      font-family: 'Oswald',sans-serif; font-size: clamp(16px, 2.5vw, 22px);
      letter-spacing: 12px; color: #555; margin-top: 10px; font-weight: 900;
      background: #111; display: inline-block; padding: 5px 15px; border: 1px solid #333;
    }

    /* WHEEL - BUZZSAW STYLE */
    .wheel-section { position: relative; display: flex; align-items: center; justify-content: center; }
    .pointer {
      position: absolute; top: -35px; left: 50%;
      transform: translateX(-50%); z-index: 20;
      filter: drop-shadow(0 10px 10px rgba(0,0,0,0.8));
    }
    .outer-ring {
      width: 580px; height: 580px; border-radius: 50%;
      background: repeating-conic-gradient(from 0deg, #111 0deg 15deg, #0a0a0a 15deg 30deg);
      padding: 12px;
      border: 8px solid #222;
      box-shadow: 0 0 80px rgba(200, 0, 0, 0.15), inset 0 0 20px rgba(0,0,0,1);
      position: relative;
    }
    /* Saw teeth illusion */
    .outer-ring::before {
      content: ''; position: absolute; inset: -15px; border-radius: 50%;
      border: 4px dashed #333; pointer-events: none;
    }
    .inner-ring {
      width: 100%; height: 100%; border-radius: 50%;
      background: #000; padding: 4px;
      border: 4px solid var(--dark-blood); overflow: hidden;
    }
    #wheel-wrap {
      width: 100%; height: 100%; border-radius: 50%; overflow: hidden;
      transform-origin: center center;
      transition: transform 4.5s cubic-bezier(0.1, 0.8, 0.1, 1.05);
    }
    #wheel-wrap svg { width: 100%; height: 100%; display: block; }

    /* BUTTON - INDUSTRIAL PEDAL */
    .controls { display: flex; flex-direction: column; align-items: center; gap: 15px; margin-top: -10px; z-index: 10; }
    #spin-btn {
      font-family: 'Anton', sans-serif;
      font-size: 32px; letter-spacing: 4px; color: #fff; text-transform: uppercase;
      background: linear-gradient(to bottom, #333, #111);
      border: none;
      padding: 20px 80px; cursor: pointer;
      position: relative;
      clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);
      box-shadow: inset 0 2px 0 rgba(255,255,255,0.2), inset 0 -4px 0 rgba(0,0,0,0.8);
      transition: background 0.1s;
    }
    #spin-btn::after {
      content: ''; position: absolute; inset: 2px;
      background: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(0,0,0,0.2) 10px, rgba(0,0,0,0.2) 20px);
      pointer-events: none;
    }
    #spin-btn:hover { background: linear-gradient(to bottom, #444, #1a1a1a); color: var(--neon-red); }
    #spin-btn:active {
      transform: translateY(4px);
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.8);
    }
    #spin-btn:disabled { color: #555; background: #111; cursor: not-allowed; transform: none; }

    /* RESULT CARD - ANGULAR / METAL SHEET */
    #result-card {
      width: min(750px, 95vw);
      background: #080808;
      border: 2px solid #222; 
      padding: 40px; text-align: left;
      opacity: 0; transform: scale(0.95) translateY(30px);
      transition: all .4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
      clip-path: polygon(30px 0, 100% 0, 100% calc(100% - 30px), calc(100% - 30px) 100%, 0 100%, 0 30px);
      position: relative;
    }
    #result-card::before {
      content: ''; position: absolute; top: 0; left: 0; width: 8px; height: 100%;
      background: var(--blood);
    }
    #result-card.show { opacity:1; transform:scale(1) translateY(0); pointer-events:auto; }

    .res-band {
      font-family:'Bebas Neue','Anton',sans-serif;
      font-size:clamp(40px, 8vw, 70px); letter-spacing:4px; color:#fff;
      line-height:0.9; text-shadow: 3px 3px 0 var(--dark-blood);
      text-transform: uppercase;
    }
    .res-msg {
      font-family:'Oswald',sans-serif; font-size: 16px;
      color:#777; margin-top:10px; margin-bottom: 30px; text-transform: uppercase; letter-spacing: 2px;
      border-bottom: 2px dashed #222; padding-bottom: 20px;
    }
    
    .res-albums { display:flex; gap:15px; margin-bottom:25px; flex-wrap: wrap; }
    .album-pill { 
      font-family:'Oswald',sans-serif; font-size:15px; font-weight: 900; color:#555; 
      background: #000; border: 2px solid #333; padding: 10px 20px; 
      cursor:pointer; transition: all .2s; text-transform: uppercase;
      clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
    }
    .album-pill:hover { border-color: #666; color: #ccc; }
    .album-pill.active { background: var(--dark-blood); border-color: var(--neon-red); color: #fff; }
    
    .res-songs-title {
      font-family:'Oswald',sans-serif; font-size:14px; letter-spacing:6px;
      color:#444; text-transform:uppercase; margin-bottom:15px; font-weight: 900;
    }
    .res-songs { display:flex; flex-direction: column; gap:8px; margin-bottom:35px; }
    .track-btn { 
      font-family:'Oswald',sans-serif; font-size:18px; font-weight: 700; color:#aaa; 
      background: #0a0a0a; border: 1px solid #1a1a1a; border-left: 4px solid #333;
      padding: 15px 20px; cursor:pointer; transition: all .2s;
      text-align: left; display: flex; justify-content: space-between; align-items: center;
      text-transform: uppercase;
    }
    .track-btn::after { 
      content: '▶ TOCAR NO APP'; font-size: 12px; color: #1DB954; 
      opacity: 0; transition: opacity .2s; letter-spacing: 2px; 
    }
    .track-btn:hover { background: #111; border-left-color: #1DB954; color: #fff; padding-left: 25px; }
    .track-btn:hover::after { opacity: 1; }

    /* SPOTIFY ARTIST BUTTON */
    #spotify-btn {
      display: none; align-items: center; justify-content: center; width: 100%;
      background: #000; border: 2px solid #1DB954;
      padding: 20px; cursor: pointer; text-decoration: none; transition: all .2s;
      clip-path: polygon(20px 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%, 0 20px);
    }
    #spotify-btn:hover { background: #1DB954; }
    #spotify-btn:hover .spotify-text { color: #000; }
    #spotify-btn.active { display: flex; }
    .spotify-text {
      font-family:'Oswald',sans-serif; font-size:18px; font-weight: 900; letter-spacing:3px;
      color:#1DB954; text-transform:uppercase; transition: color .2s;
    }

    @media(max-width:650px){ .outer-ring{width:360px;height:360px;} #spin-btn { padding: 15px 40px; font-size: 24px; } }
  </style>

          { name: 'Leave It Alone', id: '' }
        ]
      }
    ]
  },
  {
    name:'STATIC-X', icon:'STX', msg:'Metal mecânico, industrial e violento.',
    albums:[
      {
        title:'Wisconsin Death Trip', year:'1999',
        tracks:[
          { name: 'Push It', id: '' },
          { name: 'Im with Stupid', id: '' },
          { name: 'Bled for Days', id: '' },
          { name: 'Black and White', id: '' },
          { name: 'Love Dump', id: '' }
        ]
      },
      {
        title:'Machine', year:'2001',
        tracks:[
          { name: 'The Only', id: '' },
          { name: 'Cold', id: '' },
          { name: 'This Is Not', id: '' },
          { name: 'I Am', id: '' },
          { name: 'Black and White', id: '' }
        ]
      }
    ]
  }
];

// BUILD WHEEL (DARK INDUSTRIAL)
const N=BANDS.length, STEP=360/N, CX=260, CY=260, R=248;
const NS='http://www.w3.org/2000/svg';
function polar(cx,cy,r,d){const a=(d-90)*Math.PI/180;return{x:cx+r*Math.cos(a),y:cy+r*Math.sin(a)};}
function arc(cx,cy,r,a1,a2){const s=polar(cx,cy,r,a1),e=polar(cx,cy,r,a2),lg=(a2-a1)>180?1:0;return`M${cx},${cy} L${s.x.toFixed(2)},${s.y.toFixed(2)} A${r},${r} 0 ${lg} 1 ${e.x.toFixed(2)},${e.y.toFixed(2)} Z`;}
function el(tag,attrs,txt){const e=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));if(txt)e.textContent=txt;return e;}

const svg=document.getElementById('wheel-svg');
const sectors=[];

BANDS.forEach((b,i)=>{
  const a1=i*STEP, a2=a1+STEP, mid=a1+STEP/2;
  const fill = i % 2 === 0 ? '#141414' : '#0a0a0a'; 
  const p=el('path',{d:arc(CX,CY,R,a1,a2), fill:fill, stroke:'#2a2a2a', 'stroke-width':'3'});
  svg.appendChild(p); sectors.push(p);
  
  const tp=polar(CX,CY,R*0.78,mid), rot=(mid>90&&mid<270)?mid+180:mid;
  svg.appendChild(el('text',{
    x:tp.x.toFixed(2), y:tp.y.toFixed(2), 
    'text-anchor':'middle', 'dominant-baseline':'middle', 
    transform:`rotate(${rot},${tp.x.toFixed(2)},${tp.y.toFixed(2)})`,
    'font-size': b.name.length > 12 ? '15' : '18', 
    'font-weight':'900', 'font-family':'Anton, Impact, sans-serif', 
    fill:'#555', 'letter-spacing':'2'
  }, b.name));
});

// Center hub
svg.appendChild(el('circle',{cx:CX,cy:CY,r:'35',fill:'#0d0d0d',stroke:'#333','stroke-width':'5'}));
svg.appendChild(el('polygon',{points:`${CX},${CY-20} ${CX+17},${CY-10} ${CX+17},${CY+10} ${CX},${CY+20} ${CX-17},${CY+10} ${CX-17},${CY-10}`, fill:'#222'}));
svg.appendChild(el('circle',{cx:CX,cy:CY,r:'6',fill:'#000'}));

// SPIN LOGIC
const wrap=document.getElementById('wheel-wrap'), btn=document.getElementById('spin-btn');
const card=document.getElementById('result-card');
const spotifyBtn=document.getElementById('spotify-btn');
const albumsEl=document.getElementById('res-albums');
const albumTitleEl=document.getElementById('res-album-title');
const songsEl=document.getElementById('res-songs');
let totalDeg=0, spinning=false;

function resetSectors(){ 
  sectors.forEach((p, i) => { 
    p.setAttribute('fill', i % 2 === 0 ? '#141414' : '#0a0a0a'); 
    p.setAttribute('stroke', '#2a2a2a');
  });
}

function renderTracks(band, albumIndex){
  const album = band.albums[albumIndex];
  albumTitleEl.textContent = `[ ${album.title} - ${album.year} ]`;
  songsEl.innerHTML = '';

  album.tracks.forEach((trackData, trackIndex) => {
    // Processa os dados, mantendo segurança para códigos não preenchidos
    const trackName = trackData.name;
    const trackId = trackData.id;

    const btnTrack = document.createElement('button');
    btnTrack.type = 'button';
    btnTrack.className = 'track-btn';
    btnTrack.innerHTML = `<span>0${trackIndex+1} // ${trackName}</span>`;
    
    // SISTEMA DE TIRO DIRETO INTELIGENTE:
    btnTrack.addEventListener('click', () => {
      if (trackId && trackId !== '') {
        // Se a faixa tem ID cadastrado (ex: Linkin Park), ataca direto nela
        window.location.href = `spotify:track:${trackId}`;
      } else {
        // Fallback: se não tiver o ID, abre a busca exata no app
        const query = `track:${trackName} artist:${band.name}`;
        window.location.href = `spotify:search:${encodeURIComponent(query)}`;
      }
    });
    
    songsEl.appendChild(btnTrack);
  });
}

function renderBand(band){
  albumsEl.innerHTML='';
  band.albums.forEach((album,idx)=>{
    const pill = document.createElement('button');
    pill.type = 'button';
    pill.className = 'album-pill';
    if(idx===0) pill.classList.add('active');
    pill.textContent = album.title;
    
    pill.addEventListener('click', () => {
      albumsEl.querySelectorAll('.album-pill').forEach(el=>el.classList.remove('active'));
      pill.classList.add('active');
      renderTracks(band, idx);
    });
    albumsEl.appendChild(pill);
  });
  renderTracks(band, 0);
}

function spin(){
  if(spinning)return;
  spinning=true; btn.disabled=true; btn.textContent='SISTEMA TRAVADO...';
  card.classList.remove('show');
  spotifyBtn.classList.remove('active');
  resetSectors();

  // Faz o celular vibrar por 500 milissegundos
  if (navigator.vibrate) {
  navigator.vibrate([100, 50, 100, 50, 300]); // Padrão de vibração como uma batida de metal
  }

  const delta=(6+Math.floor(Math.random()*4))*360+Math.floor(Math.random()*360);
  totalDeg+=delta;
  wrap.style.transform=`rotate(${totalDeg}deg)`;

  setTimeout(()=>{
    const norm=((totalDeg%360)+360)%360;
    const idx=Math.floor(((360-norm)%360)/STEP)%N;
    const band=BANDS[idx];

    sectors[idx].setAttribute('fill', '#cc0000');
    sectors[idx].setAttribute('stroke', '#ff1a1a');

    document.getElementById('res-band').textContent = band.name;
    document.getElementById('res-msg').textContent = band.msg;
    renderBand(band);

    spotifyBtn.href = `spotify:search:${encodeURIComponent(band.name)}`;
    document.getElementById('spotify-link-text').textContent = `OUVIR ${band.name} NO APP`;
    spotifyBtn.classList.add('active');

    card.classList.add('show');
    btn.disabled=false; btn.textContent='GIRAR A MÁQUINA'; spinning=false;
  }, 4500); 
}

btn.addEventListener('click', spin);
</script>
